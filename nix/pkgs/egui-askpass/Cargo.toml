[package]
name = "egui-askpass"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
zeroize = "1"

[profile.dev]
# Keep local builds small; assertions and overflow checks stay enabled.
debug = 0

[profile.release]
# This small dialog does not need the expensive level-3 optimization passes.
opt-level = 1
