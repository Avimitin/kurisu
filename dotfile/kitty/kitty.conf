enabled_layouts tall:bias=50;full_size=1;mirrored=false,splits
enable_audio_bell no
allow_hyperlinks yes
clear_all_shortcuts yes

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+kp_add change_font_size all +1.0

map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map ctrl+shift+f5 load_config_file
map ctrl+shift+f11 toggle_fullscreen

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

map ctrl+b>c launch --type=tab --cwd=current
map ctrl+b>enter launch --cwd=current

map ctrl+b>p move_tab_backward
map ctrl+b>n move_tab_forward

# -----------------------------------------------------------------------
# Navigate Windows (Kitty Tabs) - Alt keys
# -----------------------------------------------------------------------
map alt+n next_tab
map alt+p previous_tab

# -----------------------------------------------------------------------
# Copy Mode
# -----------------------------------------------------------------------
# Opens the scrollback buffer in Kitty's builtin pager (or less)
map ctrl+b>y show_scrollback

background #1F1F28
foreground #DCD7BA
selection_background #2D4F67
selection_foreground #C8C093
url_color #72A7BC
cursor #C8C093

# Tabs
active_tab_background #1F1F28
active_tab_foreground #C8C093
inactive_tab_background  #1F1F28
inactive_tab_foreground #727169
#tab_bar_background #15161E

# normal
color0 #16161D
color1 #C34043
color2 #76946A
color3 #C0A36E
color4 #7E9CD8
color5 #957FB8
color6 #6A9589
color7 #C8C093

# bright
color8  #727169
color9  #E82424
color10 #98BB6C
color11 #E6C384
color12 #7FB4CA
color13 #938AA9
color14 #7AA89F
